name: Synchronize RC2 release notes

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v1.0.0-rc2.md
      - .github/workflows/sync-rc2-release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-rc2-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release note source
        uses: actions/checkout@v4
      - name: Update RC2 GitHub Release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0-rc2 --notes-file docs/releases/v1.0.0-rc2.md
